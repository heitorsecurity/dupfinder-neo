[package]
name = "dupfinder-neo-rust"
version = "1.0.0"
edition = "2021"
authors = ["@heitorsecurity", "Patrick De Smet"]
description = "DupFinder-Neo v1.0 (by @heitorsecurity) - Fast, accurate duplicate file finder, empty dir cleaner and real-time watcher"

[dependencies]
# Dependencias padrao opcionais (a engine de referencia funciona com pure std)
# sha2 = "0.10"
# walkdir = "2.4"
# rayon = "1.8"

[[bin]]
name = "dupfinder-rust"
path = "main.rs"

[lib]
name = "dupfinder_engine"
path = "dupfinder_engine.rs"

